[project]
name = "dag_tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "pyodbc>=5.3.0",
    "oracledb>=3.4.2",
    "polars>=0.20.10",
    "PyYAML>=6.0.1",
    # CortexDataClient uses pl.read_database_uri() for postgres;
    # Polars dispatches to connectorx for URI-based reads. connectorx
    # returns Arrow tables which Polars converts via pyarrow.
    "connectorx>=0.3.3",
    "pyarrow>=14",
    # connectorx does NOT speak ClickHouse. clickhouse-connect is the
    # official driver and exposes an Arrow query path that Polars consumes.
    "clickhouse-connect>=0.8",
    # S3-backed paths (parquet / delta / iceberg) — object_store backends.
    # deltalake brings the delta-rs runtime; pyiceberg covers iceberg REST.
    "deltalake>=0.20",
    "pyiceberg>=0.7",
]

[project.optional-dependencies]
orchestrator = [
    "dagster",
    "dagster-aws>=0.28.18",
    "dagster-cloud",
    "dagster-dbt>=0.28.18",
    "dbt-postgres>=1.8.0",
    "dagster-dlt>=0.28.18",
    "dagster-embedded-elt>=0.28.18",
    "dlt[postgres,snowflake,filesystem,clickhouse,databricks]>=1.23.0",
    "acryl-datahub>=1.4.0.5",
    "boto3>=1.34.0",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "s3fs>=0.4.2",
]
worker = [
    "restate-sdk>=0.14.0,<0.15.0",
    "hypercorn>=0.16.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]
qual = [
    # dag_tools.qual: the Dagster upgrade qualification CLI and MinIO/S3
    # registry. Installable standalone — runs in CI for survey publishing
    # and on the operator desktop for qualification orchestration.
    "typer>=0.12",
    "boto3>=1.34",
    "pydantic>=2.0.0",
]
broker = [
    # dag_tools.domain_broker — FastAPI broker that any Dagster user-
    # deployment runs as a second pod to register URNs with a mesh-
    # level central-gateway. Imports boto3 (for S3-backed IO managers),
    # fastapi/pydantic (the app + request models), and is served by
    # hypercorn. Install with `pip install "dag-tools[broker]"` from a
    # user-deployment that wants to participate in the mesh.
    "fastapi>=0.110",
    "hypercorn>=0.16",
    "pydantic>=2.0.0",
    "httpx>=0.28.1",
    "boto3>=1.34",
]
dev = [
    "dagster-webserver",
    "pytest",
    "moto[s3]>=5",
]
all = [
    "dag_tools[orchestrator,worker,qual,broker,dev]",
]

[project.scripts]
dagtools = "dag_tools.qual.cli:app"

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.dagster]
module_name = "dag_tools.definitions"
code_location_name = "dag_tools"

[tool.dagster.components]
register_components = ["dag_tools.components.dlt_pipeline", "dag_tools.components.dbt_project", "dag_tools.components.datahub_lineage", "dag_tools.components.s3_sensor", "dag_tools.components.restate_dlt_sync", "dag_tools.components.restate_api_sync"]

