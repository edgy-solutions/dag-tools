[project]
# Distribution (pip-install) name. Differs from the import package
# (`dag_tools`) because PyPI's confusable-name check rejects
# dag-tools/dag_tools (collapses to "dagtools", which is taken). The
# import name is unchanged: `pip install edgy-dag-tools` -> `import dag_tools`.
name = "edgy-dag-tools"
version = "0.3.2"
description = "Central library of common Dagster utilities, resources, IO managers, sensors, declarative components, and asset patterns for data tooling projects."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Chris Nogradi", email = "cnogradi@gmail.com" },
]
keywords = ["dagster", "dlt", "dbt", "etl", "data-engineering", "io-manager", "datahub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "pyodbc>=5.3.0",
    "oracledb>=3.4.2",
    "polars>=0.20.10",
    "PyYAML>=6.0.1",
    # dag_tools.otel_api_sync renders mapping YAML into API payloads. The
    # environment combines SandboxedEnvironment (mapping files are
    # executable config, so attribute escapes must be blocked) with
    # NativeEnvironment (a single-expression template must return a real
    # int/bool/list, or every numeric and array payload field ships as a
    # string). Both classes are required; >=3.1 is where the current
    # sandbox semantics and jinja2.nativetypes both settled.
    "jinja2>=3.1",
    # CortexDataClient uses pl.read_database_uri() for postgres;
    # Polars dispatches to connectorx for URI-based reads. connectorx
    # returns Arrow tables which Polars converts via pyarrow.
    "connectorx>=0.3.3",
    "pyarrow>=14",
    # connectorx does NOT speak ClickHouse. clickhouse-connect is the
    # official driver and exposes an Arrow query path that Polars consumes.
    "clickhouse-connect>=0.8",
    # S3-backed paths (parquet / delta / iceberg) — object_store backends.
    # deltalake brings the delta-rs runtime; pyiceberg covers iceberg REST.
    "deltalake>=0.20",
    "pyiceberg>=0.7",
]

[project.optional-dependencies]
orchestrator = [
    "dagster",
    "dagster-aws>=0.28.18",
    "dagster-cloud",
    "dagster-dbt>=0.28.18",
    "dbt-postgres>=1.8.0",
    "dagster-dlt>=0.28.18",
    "dagster-embedded-elt>=0.28.18",
    "dlt[postgres,snowflake,filesystem,clickhouse,databricks]>=1.23.0",
    "boto3>=1.34.0",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    # Floor raised from >=0.4.2, which is a 2020 release: its
    # S3FileSystem.connect() calls botocore.session.Session(**kwargs) and
    # dies with "Session.__init__() got an unexpected keyword argument
    # 'endpoint_url'" the moment an endpoint is configured -- which every
    # MinIO-backed deployment does. Modern s3fs is fsspec-calver'd and
    # goes through aiobotocore instead.
    #
    # Nothing had noticed because unconstrained resolves pick a current
    # release anyway; the CI job that pins Dagster to 1.10.19 resolves
    # under enough pressure to reach back to 0.4.x, and broke there.
    "s3fs>=2023.1.0",
    # dag_tools.resources.duckdb / dag_tools.io_managers.duckdb — DuckDB's
    # httpfs extension reads and writes s3:// directly, so a query-shaped
    # asset streams to parquet without the rows passing through Python.
    # NOTE: httpfs is normally downloaded from duckdb.org on first use;
    # bake it in at image build time if the cluster restricts egress and
    # point DUCKDB_EXTENSION_DIRECTORY at it, or DuckDBResource will fail
    # with guidance.
    "duckdb>=1.1",
]

# DataHub catalog registration. Required by
# dag_tools.components.datahub_lineage — the global ASSET_MATERIALIZATION
# sensor is built from this plugin's make_datahub_sensor, so without it
# the component's imports fall into their ImportError branch and building
# the sensor fails.
#
# THE UPPER BOUND IS LOAD-BEARING. acryl-datahub-dagster-plugin pulls
# acryl-datahub[sql-parser], and that extra pins sqlglot:
#
#   acryl-datahub <= 1.3.1.x   ->  sqlglot[rs]==27.27.0
#   acryl-datahub >= 1.4.0.4   ->  sqlglot 29.x, then 30.x
#
# while EVERY dagster-dbt release pins sqlglot[rs]<28.1.0. So the
# previous floor of >=1.4.0.5 made dagster-dbt and the DataHub sensor
# mutually unsatisfiable, and `pip install edgy-dag-tools[all]` failed
# outright with a resolver error rather than installing anything.
#
# Capping at <1.4 puts both back in one environment: verified with
# dagster 1.13.16 + dagster-dbt 0.29.16 + plugin 1.3.1.10 on sqlglot
# 27.27.0, full suite green (586 passed, nothing skipped). The plugin at
# 1.3.1.x still exposes everything the component uses -- make_datahub_
# sensor, emit_asset(schema=), dataset_urn_from_asset,
# convert_table_schema_to_schema_metadata, DatasetLineage(inputs,
# outputs) -- and declares dagster>=1.10.0, so it spans the whole
# supported range.
#
# A deployment that does NOT use the dbt component can safely install a
# newer acryl-datahub over the top; the cap exists only so the default
# install satisfies both.
#
# Revisit when dagster-dbt widens its sqlglot bound, at which point this
# cap should be raised rather than worked around.
datahub = [
    "acryl-datahub>=1.3.1,<1.4",
    "acryl-datahub-dagster-plugin>=1.3.1,<1.4",
]

worker = [
    "restate-sdk>=0.14.0,<0.15.0",
    "hypercorn>=0.16.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]
qual = [
    # dag_tools.qual: the Dagster upgrade qualification CLI and MinIO/S3
    # registry. Installable standalone — runs in CI for survey publishing
    # and on the operator desktop for qualification orchestration.
    "typer>=0.12",
    "boto3>=1.34",
    "pydantic>=2.0.0",
]
broker = [
    # dag_tools.domain_broker — FastAPI broker that any Dagster user-
    # deployment runs as a second pod to register URNs with a mesh-
    # level central-gateway. Imports boto3 (for S3-backed IO managers),
    # fastapi/pydantic (the app + request models), and is served by
    # hypercorn. Install with `pip install "dag-tools[broker]"` from a
    # user-deployment that wants to participate in the mesh.
    "fastapi>=0.110",
    "hypercorn>=0.16",
    "pydantic>=2.0.0",
    "httpx>=0.28.1",
    "boto3>=1.34",
    # UNDECLARED UNTIL 2026-08-11, and both are MODULE-LEVEL imports in
    # dag_tools/central_gateway/main.py — so `pip install "dag-tools[broker]"`
    # produced a gateway that could not import at all. It worked only where
    # something else happened to pull them in transitively, which is the
    # dependency equivalent of a test passing for the wrong reason. Found
    # while adding the subject-source gauge, which leans on PyJWT harder.
    "redis>=5.0",
    "PyJWT>=2.8",
]
dev = [
    "dagster-webserver",
    "pytest",
    "moto[s3]>=5",
]
# Everything, and it installs. This used to fail with a resolver error
# because the datahub pin and dagster-dbt disagreed about sqlglot -- see
# the note on the `datahub` extra for why the cap there is what makes
# this satisfiable.
all = [
    "edgy-dag-tools[orchestrator,datahub,worker,qual,broker,dev]",
]

[project.scripts]
dagtools = "dag_tools.qual.cli:app"

[project.urls]
Homepage = "https://github.com/edgy-solutions/dag-tools"
Repository = "https://github.com/edgy-solutions/dag-tools"
Issues = "https://github.com/edgy-solutions/dag-tools/issues"

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

# Distribution name is `edgy-dag-tools` but the import package is `dag_tools`,
# so hatchling can't auto-derive the package dir from the project name — name
# it explicitly.
[tool.hatch.build.targets.wheel]
packages = ["dag_tools"]

[tool.dagster]
module_name = "dag_tools.definitions"
code_location_name = "dag_tools"

[tool.dagster.components]
register_components = ["dag_tools.components.dlt_pipeline", "dag_tools.components.dbt_project", "dag_tools.components.datahub_lineage", "dag_tools.components.s3_sensor", "dag_tools.components.restate_dlt_sync", "dag_tools.components.restate_api_sync", "dag_tools.components.grist_ingest"]

