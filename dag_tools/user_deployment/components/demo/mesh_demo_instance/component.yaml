type: dag_tools.user_deployment.components.demo.mesh_demo.MeshDemoComponent

attributes:
  # Bucket where mesh_demo_customers writes its parquet. Must match the
  # bucket the broker pod's IO manager instance sees so the routing
  # ticket it advertises points at the same location handle_output
  # writes to. Override via DAG_TOOLS_DEMO_S3_BUCKET (without the s3://
  # prefix). Default ``dag-lake`` — the bucket owned by the dag-tools
  # user-deployment. The old pub-tools-hosted demo wrote to
  # ``publog-lake``; this relocation moves writes to ``dag-lake`` so
  # the bucket reflects the new owning deployment. The bucket must
  # exist in the target cluster's MinIO before the first
  # materialization; on the sandbox cluster this is provisioned as
  # part of the MinIO setup. The DataHub URN
  # (``urn:li:dataset:(...,mesh_demo_customers,PROD)``) stays the
  # same because it comes from the asset_key + platform, NOT the
  # bucket — so DataHub history isn't orphaned by the bucket change;
  # only the underlying S3 path moves.
  s3_bucket: "{{ env('DAG_TOOLS_DEMO_S3_BUCKET', 'dag-lake') }}"
  prefix: "{{ env('MESH_DEMO_PREFIX', 'mesh_demo') }}"

  # Central gateway URL — required by CortexPolarsIOManager's schema
  # even when the asset doesn't read upstreams. The demo asset only
  # produces, so client_id/client_secret stay empty (the consumer side
  # only needs them when fetching upstreams through the gateway).
  broker_url: "{{ env('CENTRAL_GATEWAY_URL', 'http://iagent-central-gateway:8090') }}"
  client_id: "{{ env('CORTEX_CLIENT_ID', '') }}"
  client_secret: "{{ env('CORTEX_CLIENT_SECRET', '') }}"
  keycloak_url: "{{ env('KEYCLOAK_TOKEN_URL', '') }}"

  asset_name: "mesh_demo_customers"
  asset_group: "mesh_demo"
