name: Tests

# Runs the test suite on every push and PR.
#
# This did not exist until 2026-08-01. The suite had ~580 tests and NOTHING
# ran them automatically, which is how the DeltaIOManager write path came to
# be broken against the deltalake version this package itself declares --
# its tests were skipping because the dependency was absent, and a skipped
# test is indistinguishable from a passing one in a summary line.
#
# So the jobs below install the COMPLETE optional-dependency set and then
# fail if anything skipped for a missing import. Coverage that quietly
# shrinks is the specific problem this workflow exists to prevent.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `all` installs everything, dbt and datahub included -- the
        # datahub extra's <1.4 cap is what makes that satisfiable. If a
        # future bump reintroduces the sqlglot conflict, this job fails
        # at install rather than quietly dropping one integration.
        #
        # Python is 3.11/3.12, not the full >=3.10,<3.15 range: connectorx
        # and restate-sdk lag on 3.13 wheels, so a 3.13 leg would fail on
        # packaging rather than on this code.
        python: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # pyodbc is a BASE dependency and builds against unixodbc headers,
      # which the runner image does not ship.
      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev

      - name: Create venv
        run: uv venv --python ${{ matrix.python }}

      # [all] fans out to orchestrator + datahub + worker + qual + broker
      # + dev. Installing the full set is the point: every partial install
      # turns real coverage into silent skips.
      #
      # No override: `[all]` resolves on its own now that the datahub
      # extra is capped below the sqlglot break. If that cap is ever
      # raised past dagster-dbt's bound this step fails outright, which is
      # the behaviour we want -- previously the conflict was papered over
      # with a constraints file.
      - name: Install package with all extras
        run: uv pip install -e ".[all]"

      - name: Show resolved versions
        run: |
          uv pip list | grep -Ei "^(dagster|deltalake|duckdb|polars|pyarrow|pandas|acryl|moto|typer|connectorx)" || true

      # .venv/bin/python directly, not `uv run`: `uv run` re-syncs the
      # project environment from pyproject and would drop the extras
      # installed above -- silently reintroducing the very skips this
      # workflow exists to catch.
      - name: Run tests
        run: |
          set -o pipefail
          .venv/bin/python -m pytest dag_tools_tests -q --no-header -rs \
            --junitxml=junit-${{ matrix.python }}.xml 2>&1 | tee pytest-output.txt

      # The guard, checked against the run above rather than a second
      # invocation. A test skipped because a package is missing means CI
      # is under-installed, not that the code is fine -- and it goes
      # green. Genuine skips (platform-specific, e.g. the Windows
      # drive-letter path test) give a written reason and are left alone.
      - name: Fail on dependency-driven skips
        if: always()
        run: |
          if grep -E "SKIPPED.*(could not import|not installed|No module named)" pytest-output.txt; then
            echo "::error::Tests skipped because a dependency is missing. CI is under-installed —"
            echo "::error::add the package so these tests actually run instead of silently passing."
            exit 1
          fi
          echo "No dependency-driven skips."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-py${{ matrix.python }}
          path: junit-${{ matrix.python }}.xml
          if-no-files-found: warn
          retention-days: 14

  dagster-floor:
    name: dagster 1.10.19 (compat floor)
    runs-on: ubuntu-latest
    # Non-blocking: this guards a version the project does not formally
    # support (the `orchestrator` extra already requires dagster>=1.12.18
    # via dagster-aws>=0.28.18). It exists because production is on
    # 1.10.19 and has to keep working until that upgrade lands, so a break
    # here is information rather than a reason to stop the line.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev

      - name: Create venv
        run: uv venv --python 3.11

      # Base dependencies declare NO dagster, so the version under test is
      # pinned explicitly here. The `orchestrator` extra is deliberately
      # NOT used: its dagster-aws>=0.28.18 floor is unsatisfiable with
      # 1.10.19, which is itself the reason production cannot adopt
      # dag-tools until it upgrades.
      # `worker` is included so the restate tests run here too -- the first
      # version of this job left restate and the datahub plugin out, and
      # those tests skipped silently, which is the exact failure mode the
      # other job guards against.
      # ONE resolution, not two. Installing the extras first and the
      # pinned packages second let uv solve them independently: fsspec was
      # already fixed by the first command, modern s3fs pins a matching
      # fsspec calver, so the second solve backtracked to s3fs 0.4.2 --
      # which pins nothing and is from 2020. The job then failed inside
      # s3fs with a TypeError that named neither package.
      #
      # s3fs is floored explicitly because the `orchestrator` extra that
      # normally carries that floor is unusable here (its
      # dagster-aws>=0.28.18 implies dagster>=1.12.18).
      - name: Install with dagster pinned to the floor
        run: |
          uv pip install \
            -e ".[qual,broker,worker,dev]" \
            "dagster==1.10.19" \
            "dagster-aws==0.26.19" \
            "dagster-dbt==0.26.19" \
            "dagster-postgres==0.26.19" \
            "dbt-postgres>=1.8.0" \
            "pyarrow" "polars" "pandas" "duckdb" "deltalake" \
            "s3fs>=2023.1.0" \
            "acryl-datahub>=1.3.1,<1.4" \
            "acryl-datahub-dagster-plugin>=1.3.1,<1.4" \
            "connectorx"

      # s3fs/botocore are listed because a resolve under this much version
      # pressure once reached back to s3fs 0.4.2 (2020), which fails with a
      # TypeError deep inside connect() rather than anything that names the
      # package. Printing them makes the next such failure diagnosable
      # from the log alone.
      - name: Show resolved versions
        run: uv pip list | grep -Ei "^(dagster|deltalake|duckdb|polars|pyarrow|s3fs|boto|aiobotocore|fsspec)" || true

      # Confirm the pin actually took. Without this the job could quietly
      # resolve to a newer dagster and report a pass that says nothing
      # about the floor.
      - name: Assert pins actually took
        run: |
          V=$(.venv/bin/python -c "import dagster; print(dagster.__version__)")
          echo "dagster == $V"
          test "$V" = "1.10.19" || { echo "::error::expected dagster 1.10.19, got $V"; exit 1; }
          # s3fs is asserted too: it silently resolved to 0.4.2 (2020) once
          # already, and the resulting failure named neither s3fs nor a
          # version. Anything pre-calver is wrong.
          S=$(.venv/bin/python -c "import s3fs; print(s3fs.__version__)")
          echo "s3fs == $S"
          case "$S" in
            0.*|1.*) echo "::error::s3fs resolved to $S — pre-aiobotocore era"; exit 1 ;;
          esac

      # dlt / dagster-embedded-elt / dagster-aws are not all installable
      # against 1.10.19 alongside the rest, so those modules are excluded
      # explicitly rather than letting a collection error mask the result.
      - name: Run tests
        run: |
          .venv/bin/python -m pytest dag_tools_tests -q --no-header -rs \
            --ignore=dag_tools_tests/test_ct_logic_mocked.py \
            --ignore=dag_tools_tests/test_dlt_assets_factory_config.py \
            --ignore=dag_tools_tests/test_s3_sensor.py \
            --ignore=dag_tools_tests/test_sql_ct_database_config.py

  # The dbt -> DataHub publishing path, run for real.
  #
  # This job exists because the path shipped broken and no test could see
  # it. `CustomDbtProjectComponent.execute` shells out to dbt three times
  # and hands the artifacts to `datahub ingest`; dagster-dbt gives every
  # invocation its OWN target directory, so the artifacts scattered and
  # ingestion died on a missing sources.json. Every unit test passed
  # throughout -- `_publish_to_datahub` swallows ingestion failures by
  # design (a DataHub outage must not fail the dbt build), so nothing that
  # mocks dbt or asserts "execute() didn't raise" can observe the break.
  #
  # Only a run with the real dbt CLI, real artifacts on disk and the real
  # datahub CLI catches it, which is what this does. The GMS is an
  # in-process HTTP recorder rather than a real DataHub (that needs Kafka +
  # Elasticsearch + MySQL); the failure is on the ingestion SOURCE side and
  # surfaces long before the sink.
  dbt-datahub-e2e:
    name: dbt to DataHub (end-to-end)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev

      - name: Create venv
        run: uv venv --python 3.12

      - name: Install package with all extras
        run: uv pip install -e ".[all]"

      - name: Show resolved versions
        run: uv pip list | grep -Ei "^(dagster-dbt|dbt-core|dbt-postgres|acryl-datahub)" || true

      # The test shells out to `dbt` and `datahub` BY NAME, so the venv's
      # bin dir has to be on PATH -- `.venv/bin/python -m pytest` alone does
      # not put it there, and the failure is an opaque pydantic error,
      # "The dbt executable 'dbt' does not exist".
      #
      # A skip here would mean the job proved nothing: the test skips itself
      # when DAGTOOLS_E2E_DBT is unset or docker is missing, and both are
      # supposed to hold on this runner. So a skip is treated as a failure,
      # on the same principle as the dependency-skip guard in the job above.
      - name: Run the end-to-end test
        env:
          DAGTOOLS_E2E_DBT: "1"
        run: |
          set -o pipefail
          export PATH="$PWD/.venv/bin:$PATH"
          .venv/bin/python -m pytest dag_tools_tests/test_dbt_datahub_e2e.py \
            -q --no-header -rs 2>&1 | tee e2e-output.txt
          if grep -qE "[0-9]+ skipped" e2e-output.txt; then
            echo "::error::The end-to-end test SKIPPED, so this job proved nothing."
            echo "::error::Expected DAGTOOLS_E2E_DBT=1 and a working docker on the runner."
            exit 1
          fi

      - name: Show docker state on failure
        if: failure()
        run: |
          docker ps -a || true
          docker compose -f dag_tools_tests/dbt_datahub_e2e/docker-compose.yaml logs || true
