name: Build & Push Container Images

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/dag-tools

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: "Docker · ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: central-gateway
            context: ./dag_tools/central_gateway
            dockerfile: ./dag_tools/central_gateway/Dockerfile
          - service: restate-worker
            context: .
            dockerfile: ./Dockerfile.restate-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU emulation for cross-arch builds. Required for the arm64
      # variant on x86_64 GitHub-hosted runners — without it the image
      # is silently amd64-only and arm64 k8s clusters fail to pull with
      # `no matching manifest for linux/arm64/v8`.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx is required for `platforms:` multi-arch builds. Was
      # missing entirely from this workflow; build-push-action@v5 needs
      # an explicit buildx setup to do cross-arch builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute image tags from the git ref:
      #   - Branch push (master/main) → :sha-<short> + :latest
      #   - Tag push (vX.Y.Z)         → :X.Y.Z + :X.Y
      # PR builds get no tags emitted here (push: is false on PR).
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Push on any push event the workflow triggers on — i.e. master/main
          # branch pushes and v* tag pushes. PR events have event_name=
          # 'pull_request' and are excluded.
          push: ${{ github.event_name == 'push' }}
          # Multi-arch: matches the runtime cluster shapes we deploy to
          # (linux/amd64 GitHub-hosted CI runners, linux/arm64 k3s clusters).
          # Build time roughly doubles because the arm64 layer goes through
          # QEMU emulation. Mirror of the pattern in iagent's build matrix.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}