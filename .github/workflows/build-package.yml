name: Build Python Package

# Builds the edgy-dag-tools sdist+wheel on every push and PR so consumers can
# grab the latest from a workflow artifact. On tag pushes (vX.Y.Z) the artifacts
# are attached to a GitHub Release AND published to PyPI (trusted publishing).
# Distribution name is `edgy-dag-tools`; the import package is `dag_tools`.
#
#   pip install edgy-dag-tools
#   # or pin a Release wheel by URL:
#   uv add "edgy-dag-tools @ https://github.com/edgy-solutions/dag-tools/releases/download/v0.1.1/edgy_dag_tools-0.1.1-py3-none-any.whl"

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the wheel as a release asset on tag pushes

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build wheel + sdist
        run: uv build          # both sdist + wheel (PyPI wants both)

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dag-tools-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    # Only publish on a version tag push (e.g. v0.1.1), never on branch/PR builds.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing — no API token/secret needed
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dag-tools-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
