name: Build Python Package

# Builds the edgy-dag-tools sdist+wheel on every push and PR so consumers can
# grab the latest from a workflow artifact. On tag pushes (vX.Y.Z) the artifacts
# are attached to a GitHub Release AND published to PyPI (trusted publishing).
#
# On a tag, the job order is the release's whole contract:
#
#   build            creates the release (the ONE creator) and attaches the wheel
#     |-- chart      calls publish-helm-chart.yml; uploads the chart tarball
#     '-- images     calls build-containers.yml; renames the images, uploads image.json
#   publish-pypi     needs all three, so nothing reaches PyPI for a release that
#                    is missing an asset
# Distribution name is `edgy-dag-tools`; the import package is `dag_tools`.
#
#   pip install edgy-dag-tools
#   # or pin a Release wheel by URL:
#   uv add "edgy-dag-tools @ https://github.com/edgy-solutions/dag-tools/releases/download/v0.1.1/edgy_dag_tools-0.1.1-py3-none-any.whl"

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the wheel as a release asset on tag pushes

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel + sdist
        run: uv build          # both sdist + wheel (PyPI wants both)

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: dag-tools-dist
          # Name the distributions rather than globbing the directory: `uv build`
          # also writes `dist/.gitignore`, and a bare `dist/*` sweeps it up.
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      # THE ONE CREATOR of a release in this repository. Every other workflow that
      # puts a file on a release is called from a job below that `needs: build`,
      # and uploads into it with `gh release upload` -- the chart tarball and the
      # image record both do -- because a second creator does not collide, it
      # makes a second release, and
      # which of the two a tag's generated notes land on is then an accident of
      # ordering (measured on v0.16.0, whose published release has no body at all).
      # This job creates it because it is the one that generates those notes.
      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # Same reason as the upload above, with a visible symptom: a release asset
          # may not begin with a dot, so GitHub renamed `dist/.gitignore` and every
          # release from v0.10.0 on carried a stray 1-byte `default.gitignore`.
          # `fail_on_unmatched_files` now also means a missing sdist fails the tag
          # instead of quietly publishing a wheel-only release.
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

  # The two other writers, called rather than started by the tag themselves, so
  # `needs` can order them after the creator. The callee's permissions are bounded
  # by the caller job's, so each grants what its workflow writes. No secret is
  # passed: `GITHUB_TOKEN` is available to a called workflow as it is.
  chart:
    name: Chart onto the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-helm-chart.yml

  images:
    name: Images and image record onto the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-containers.yml

  publish-pypi:
    name: Publish to PyPI
    # Every asset is on the release before anything is published: a failed chart
    # or image-record attach fails its caller job, and this one does not run.
    # The trusted publisher is bound to THIS file's name, which is why the
    # publish stays here and the other writers are called from here.
    needs: [build, chart, images]
    # Only publish on a version tag push (e.g. v0.1.1), never on branch/PR builds.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing — no API token/secret needed
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: dag-tools-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
