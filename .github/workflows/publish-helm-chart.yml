name: Publish Helm Chart

# Lints and packages the helm/dag-tools chart on every push and PR.
# On tag pushes (vX.Y.Z), pins the chart version to the tag, publishes
# it to ghcr.io as an OCI artifact, and attaches the tarball to the
# release so downstream charts can depend on it:
#
#   dependencies:
#     - name: dag-tools
#       version: 0.1.0
#       repository: oci://ghcr.io/edgy-solutions/charts
#       condition: dag-tools.enabled

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_DIR: helm/dag-tools

permissions:
  contents: write   # for release upload on tag push
  packages: write   # for OCI push

jobs:
  publish:
    name: Lint, package, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.3

      - name: Lint
        run: helm lint ${{ env.CHART_DIR }}

      - name: Pin chart version to the git tag (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" ${{ env.CHART_DIR }}/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" ${{ env.CHART_DIR }}/Chart.yaml
          echo "Pinned chart to ${VERSION}:"
          head -5 ${{ env.CHART_DIR }}/Chart.yaml

      - name: Package
        run: |
          mkdir -p dist-chart
          helm package ${{ env.CHART_DIR }} -d dist-chart

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dag-tools-chart
          path: dist-chart/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Log in to GHCR OCI (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push chart to OCI registry (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for chart in dist-chart/*.tgz; do
            helm push "$chart" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
          done

      - name: Attach chart tarball to the GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-chart/*.tgz
          generate_release_notes: false
          fail_on_unmatched_files: true
