name: Publish Helm Chart

# Lints and packages the helm/dag-tools chart on every push and PR.
# On tag pushes (vX.Y.Z), pins the chart version to the tag, publishes
# it to ghcr.io as an OCI artifact, and attaches the tarball to the
# release so downstream charts can depend on it:
#
#   dependencies:
#     - name: dag-tools
#       version: 0.1.0
#       repository: oci://ghcr.io/edgy-solutions/charts
#       condition: dag-tools.enabled

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_DIR: helm/dag-tools

permissions:
  contents: write   # for release upload on tag push
  packages: write   # for OCI push

jobs:
  publish:
    name: Lint, package, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.3

      - name: Lint
        run: helm lint ${{ env.CHART_DIR }}

      - name: Pin chart version to the git tag (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" ${{ env.CHART_DIR }}/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" ${{ env.CHART_DIR }}/Chart.yaml
          echo "Pinned chart to ${VERSION}:"
          head -5 ${{ env.CHART_DIR }}/Chart.yaml

      - name: Package
        run: |
          mkdir -p dist-chart
          helm package ${{ env.CHART_DIR }} -d dist-chart

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: dag-tools-chart
          path: dist-chart/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Log in to GHCR OCI (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push chart to OCI registry (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for chart in dist-chart/*.tgz; do
            helm push "$chart" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
          done

      # This job ADDS to the release; it does not create one. Two creators is how
      # a tag ends up with two releases: this step and the wheel workflow's both
      # created one, within the same second, for v0.16.0 and v0.16.1 -- each of
      # those tags carries an empty draft beside its published release. The harm
      # is not tidiness. Which of the two the generated notes land on is an
      # accident of ordering: on v0.16.0 they went to the draft nobody sees and
      # the published release has an empty body; on v0.16.1 it came out the other
      # way round. So the creator is the workflow that generates the notes -- the
      # wheel's -- and every other writer waits for that release and uploads into
      # it, the way the image record already does.
      #
      # `gh release upload` writes to the PUBLISHED release `gh release view`
      # resolves, so it cannot mint a second one however the race goes. No
      # credential is added: `GITHUB_TOKEN` with this workflow's existing
      # `contents: write` is what attaches the asset.
      - name: Attach chart tarball to the GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # What `fail_on_unmatched_files` was doing: a glob matching nothing must
          # not read as a clean attach. Unmatched, bash leaves the pattern itself.
          charts=(dist-chart/*.tgz)
          if [ ! -e "${charts[0]}" ]; then
            echo "::error::helm packaged no chart tarball to attach"
            exit 1
          fi
          # The two workflows are not ordered, so the release may not exist yet.
          # Waiting and then failing is deliberate: a chart silently absent from a
          # release is what a downstream `oci://` dependency discovers later.
          for _ in $(seq 1 30); do
            if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "${charts[@]}" --clobber
              echo "attached ${charts[*]} to ${GITHUB_REF_NAME}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::no release named ${GITHUB_REF_NAME} to attach the chart to"
          exit 1
