type: dag_tools.OtelApiSyncComponent

attributes:
  # Restate ingress base. The component appends
  # /ApiCallPlanService/<group>/execute_plan/send per execution group.
  restate_endpoint: "{{ env.RESTATE_INGRESS_URL }}"

  # ClickHouse holding the OpenTelemetry exporter tables.
  source_config:
    drivername: clickhouse
    host: "{{ env.CLICKHOUSE_HOST }}"
    port: 8123
    username: default
    password: "{{ env.CLICKHOUSE_PASSWORD }}"
    database: otel
    secure: false

  # Staging destination. Staging buys replay, an incremental cursor, and
  # a durable dispatch ledger; see the pipeline's `staged:` flag.
  dest_config:
    drivername: postgresql
    credentials: "{{ env.POSTGRES_DSN }}"
    database: telemetry
    schema: otel_staging

  pipelines:
    ci_results:
      name: otel_ci_results
      staged: true
      dest_schema: otel_staging
      mapping_file: mapping.yaml
      group_name: otel_api_sync
      sources:
        - name: execution_spans
          # Any SELECT works — table, view, JOIN, or aggregate.
          query: >
            SELECT Timestamp, TraceId, SpanId, SpanName, ServiceName,
                   ResourceAttributes, SpanAttributes
            FROM otel.otel_traces
            WHERE SpanName = 'execution.event'
          cursor_column: Timestamp
          # Telemetry arrives out of order; re-read a trailing window and
          # let the primary key dedupe.
          lookback_seconds: 600
          primary_key:
            - TraceId
            - SpanId
          write_disposition: merge
          map_columns:
            - ResourceAttributes
            - SpanAttributes
      ledger:
        enabled: true
        backend: sql
        table: otel_api_dispatch_ledger

      # Non-secret, per-deployment API config. Resolved by Dagster's own
      # `{{ env.X }}` substitution (a different mechanism from mapping.yaml's
      # Jinja, which the mapping engine renders) and merged over the
      # mapping's `api:` block before validation, so mapping.yaml stays
      # portable across environments.
      api:
        base_url: "{{ env.TARGET_API_BASE_URL }}"
        # Rarely needed: header values placed here are rendered directly
        # into the plan and persisted in the Restate journal (readable via
        # the Restate CLI/UI), unlike mapping.yaml's `header_env`, which
        # keeps the secret on the worker and puts only its variable name in
        # the plan. Only uncomment this for a header whose exposure in the
        # journal is acceptable.
        # plan_carried_headers:
        #   X-Trace-Source: dag-tools

      # Reconciles dispatch against what Restate actually executed. `/send`
      # only means "accepted"; this polls get_status so a run doesn't go
      # green on a plan that failed after acceptance.
      completion_check:
        enabled: true
        blocking: true
        poll_interval_seconds: 2
        timeout_seconds: 300
