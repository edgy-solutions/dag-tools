type: dag_tools.RestateDltSyncComponent

attributes:
  source_config:
    type: sql_database
    drivername: oracle+oracledb
    credentials: "{{ env.ORACLE_DSN_URL }}"
    schema: PDM
  dest_config:
    type: postgres
    credentials: "{{ env.POSTGRES_DSN }}"
    database: pdm_local
    schema: pdm_raw
  restate_endpoint: "{{ env.RESTATE_INGRESS_URL }}/GenericOracleAckService/mark_as_processed/send"
  pipelines:
    pdm_extraction:
      name: oracle_pdm_to_postgres
      dest_schema: pdm_raw
      primary_key: PART_ID
      sources:
        - PDM_STAGING
      pipeline_kwargs:
        write_disposition: merge
      hints:
        PDM_STAGING:
          incremental:
            cursor_path: LAST_MODIFIED
          primary_key: PART_ID
