# A STAND-IN classification document, for this example only.
#
# dag-tools ships no such document and names nothing in it: policy owns this
# file, the deployment mounts it (normally at /etc/dagtools/classification/,
# or wherever DAGTOOLS_CLASSIFICATION_LEVELS points), and the component
# validates every label against whatever it finds there. The ids below are
# deliberately shaped like placeholders -- `rung_*`, `facet_*` -- so that
# nothing here can be mistaken for a real policy's words.
#
# Three things about the shape are load-bearing:
#
#   * EXACTLY ONE dimension sets `hierarchical: true`. That is the ladder:
#     its values are ordered least restrictive FIRST, a label takes exactly
#     one of them, and a reader's clearance is a ceiling on it.
#   * Every other dimension declares HOW a reader is checked against it,
#     with `type:` -- `restrictive_set` (the reader holds all of a label's
#     values), `permissive_set` (holds at least one) or `exclusionary`
#     (holds none). Leaving it out means `restrictive_set`, which is what
#     every unordered dimension meant before the types were named.
#   * The type is also how two labels compose downstream, and the three do
#     not all point the same way: a restrictive or exclusionary set unions,
#     a permissive one INTERSECTS, because a wider permissive set admits
#     MORE readers. For the same reason the most restrictive label is every
#     value of a restrictive or exclusionary dimension and NO value of a
#     permissive one -- which is what an unlabelled column (deny by
#     default) comes out as.
classification_dimensions:
  - id: example_ladder
    hierarchical: true
    values:
      - id: rung_open
        reason: Anyone in the organization may read it.
        ratified_by: example-board
      - id: rung_internal
        reason: Readers inside the owning domain.
        ratified_by: example-board
      - id: rung_restricted
        reason: Named readers only.
        ratified_by: example-board

  - id: example_facet
    # Spelled out although it is the default, because a reader of this file
    # should not have to know what an omitted type means.
    type: restrictive_set
    values:
      - id: facet_x
        reason: A handling obligation a reader must hold.
        ratified_by: example-board
      # Declared but not yet signed. The component publishes it and reports it
      # as `unratified_values`; set `require_ratified: true` to refuse instead.
      - id: facet_y
        reason: A second obligation, pending ratification.
