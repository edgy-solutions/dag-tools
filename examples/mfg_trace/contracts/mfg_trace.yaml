# MANUFACTURING TRACEABILITY CURATED CONTRACT -- TEMPLATE, NOT A CUSTOMER'S SHAPE.
#
# One YAML document per curated table, each loadable by
# `dag_tools.contract_mapping.contract.load_contract` unchanged (docs/plans/mfg-trace.md, D6).
# This template is dag-tools' PUBLISHED INTERFACE (Q1): the columns the derive package reads.
# The deployment's real contract is registered in iagent as a SUPERSET of it -- columns may be
# added, never dropped or renamed -- and iagent's CI checks it against this file at a pinned
# dag-tools sha. Every value below is generic or synthetic.
#
# Conventions used in every document:
#   produced_since: null -- declared, not yet produced by any dag-tools release.
#   nullable / personal_data / description -- read-side fields; the contract loader ignores
#     them (extra="ignore") and the iagent reader consumes them. `personal_data` records a
#     FACT; the classification LEVEL is the deployment's, applied through warehouse_source
#     against its own dimensions file, never written here (D8).
#   timestamp (always UTC) / date / array<string> -- contract types added in PR B, and to the
#     iagent reader in the same change (D10, Q7 answered). Until PR B lands, load_contract
#     reports them as unknown_types notes.
#   source_system / cadence.set_by -- carry SOURCE IDS (pdm, mes, test_repo): the role a source
#     plays here, never the vendor. Adapters, raw tables and the DataHub platform keep the
#     vendor name, so replacing a vendor changes an adapter and no curated row.
#   tags.order_by / tags.current_view / tags.projections -- physical layout the engine relies on.
#   dataset.urn -- DERIVED after the first materialization, never typed.
---
