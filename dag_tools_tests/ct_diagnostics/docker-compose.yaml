services:
  # 1. SQL Server (Source)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    volumes:
      - ./init_sqlserver.sql:/docker-entrypoint-initdb.d/init_sqlserver.sql
    command: >
      bash -c "
      /opt/mssql/bin/sqlservr &
      echo 'Waiting for SQL Server to be ready...' &&
      for i in {1..50}; do
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1' > /dev/null 2>&1
        if [ $$? -eq 0 ]; then
          echo 'SQL Server is UP. Running init script...'
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -i /docker-entrypoint-initdb.d/init_sqlserver.sql
          break
        fi
        sleep 2
      done &&
      wait"

  # 2. Postgres (Destination)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=dest_db
